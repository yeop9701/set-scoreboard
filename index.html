<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="세트마다 체크하는 운동 기록. 남은 세트, 연속 완주, 월별 밀도를 한 화면에서 봅니다.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141C23" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="스코어보드">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0}</style>
<title>세트 스코어보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&display=swap">

<style>
/* ═══ tokens ═══════════════════════════════════════════════
   전광판(scoreboard)에서 가져온 팔레트. 낮에는 차가운 회청색
   종이, 밤에는 계기판 하우징. 강조는 LED 앰버 하나.
   한글은 시스템 폰트(아이폰 Apple SD Gothic Neo / 갤럭시 Roboto)
   를 써서 웹폰트 교체로 글자 모양이 바뀌는 현상을 없앴다.
   숫자 판독부만 Saira Condensed(라틴 전용, 경량).           */
:root{
  --bg:#EDEFF2; --board:#FFFFFF; --board-2:#F4F6F9; --sunk:#E4E8ED;
  --line:#D6DDE4; --line-soft:#E6EAEF;
  --ink:#151A20; --ink-2:#3C454F; --muted:#6B7681;
  --pip-off:#C6CFD8;
  --amber:#C85B08; --amber-ink:#8F4106; --amber-soft:#FDEEDF;
  --cyan:#0B6C78; --cyan-soft:#E3F1F3;
  --ok:#146B52; --ok-soft:#E2F1EB; --fail:#A83636; --fail-soft:#F8E7E5;
  --on-accent:#FFFFFF; --on-ok:#FFFFFF;
  --shadow:0 1px 2px rgba(20,26,33,.05), 0 10px 26px -16px rgba(20,26,33,.28);
  --ring:0 0 0 3px rgba(200,91,8,.3);

  --f-disp:'Saira Condensed',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',Roboto,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',Roboto,'Noto Sans KR',sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1015; --board:#141C23; --board-2:#1A242C; --sunk:#0E161C;
    --line:#27333D; --line-soft:#1E2831;
    --ink:#E9EEF3; --ink-2:#BFCAD4; --muted:#8695A2;
    --pip-off:#2F3D4A;
    --amber:#FF9426; --amber-ink:#FFB061; --amber-soft:#2C1D0C;
    --cyan:#3FC6D2; --cyan-soft:#0F272B;
    --ok:#43C08E; --ok-soft:#122A22; --fail:#E86A63; --fail-soft:#2C1615;
    --on-accent:#17100A; --on-ok:#06160F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.8);
    --ring:0 0 0 3px rgba(255,148,38,.34);
  }
}
:root[data-theme="dark"]{
  --bg:#0B1015; --board:#141C23; --board-2:#1A242C; --sunk:#0E161C;
  --line:#27333D; --line-soft:#1E2831;
  --ink:#E9EEF3; --ink-2:#BFCAD4; --muted:#8695A2;
  --pip-off:#2F3D4A;
  --amber:#FF9426; --amber-ink:#FFB061; --amber-soft:#2C1D0C;
  --cyan:#3FC6D2; --cyan-soft:#0F272B;
  --ok:#43C08E; --ok-soft:#122A22; --fail:#E86A63; --fail-soft:#2C1615;
  --on-accent:#17100A; --on-ok:#06160F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.8);
  --ring:0 0 0 3px rgba(255,148,38,.34);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--f-body); font-size:15px; line-height:1.55;
  -webkit-tap-highlight-color:transparent;
}
button{touch-action:manipulation}
button,input,select,textarea{font-family:inherit; color:inherit}
/* 아이폰은 16px 미만 입력칸에 포커스하면 화면을 확대한다 */
input,select,textarea{font-size:16px}
:focus-visible{outline:none; box-shadow:var(--ring); border-radius:8px}
h1,h2,h3{margin:0; text-wrap:balance; font-weight:600}
.num{font-family:var(--f-disp); font-variant-numeric:tabular-nums; font-weight:600}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.lbl{font-size:11.5px; font-weight:600; letter-spacing:.06em; color:var(--muted)}
.wrap{max-width:820px; margin:0 auto; padding:0 15px 40px}
.sub{font-size:12.5px; color:var(--muted)}
[hidden]{display:none !important}

/* ═══ header ═══════════════════════════════════════════════ */
.board-top{
  background:var(--board); border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:30; padding-top:env(safe-area-inset-top);
}
.board-top .wrap{padding-bottom:0}
.strip{display:flex; align-items:center; gap:14px; padding:11px 0}
.who{
  display:flex; align-items:center; gap:8px; margin-right:auto; min-width:0;
  background:none; border:0; padding:0; cursor:pointer; text-align:left;
}
.av{
  width:34px; height:34px; flex:none; border-radius:50%; display:grid; place-items:center;
  font-family:var(--f-disp); font-weight:700; font-size:15px;
  background:var(--amber-soft); color:var(--amber-ink); border:1px solid var(--amber-soft);
}
.av.p2{background:var(--cyan-soft); color:var(--cyan); border-color:var(--cyan-soft)}
.who-t{display:flex; flex-direction:column; min-width:0}
.who-t b{font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.who-t span{font-size:11.5px; color:var(--muted); white-space:nowrap}
.readout{display:flex; align-items:baseline; gap:5px; flex:none}
.readout .v{font-family:var(--f-disp); font-size:25px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums}
.readout .u{font-size:11px; color:var(--muted)}
.readout.hot .v{color:var(--amber)}
.readout.done .v{color:var(--ok)}
.ringwrap{display:flex; align-items:center; gap:9px; flex:none}
.ring{width:42px; height:42px; flex:none; transform:rotate(-90deg)}
.ring circle{fill:none; stroke-width:5; stroke-linecap:round}
.ring .bg{stroke:var(--sunk)}
.ring .fg{stroke:var(--amber); transition:stroke-dashoffset .45s cubic-bezier(.22,.7,.3,1)}
.ring.full .fg{stroke:var(--ok)}

/* ═══ tabs — 모바일에서는 하단 고정 바 ═════════════════════ */
.tabs{display:flex; gap:2px}
.tabs button{
  appearance:none; background:none; border:0; cursor:pointer;
  padding:10px 15px 11px; font-size:14px; font-weight:600; color:var(--muted);
  border-bottom:2px solid transparent; white-space:nowrap;
}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--amber)}
@media (max-width:640px){
  .tabs{
    position:fixed; left:0; right:0; bottom:0; z-index:40; gap:0;
    background:var(--board); border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
    box-shadow:0 -6px 20px -14px rgba(0,0,0,.4);
  }
  .tabs button{
    flex:1; padding:12px 2px; font-size:12.5px;
    border-bottom:0; border-top:2px solid transparent;
  }
  .tabs button[aria-selected="true"]{border-bottom-color:transparent; border-top-color:var(--amber)}
  main.wrap{padding-bottom:88px}
  .strip{gap:10px}
}

/* ═══ cards ════════════════════════════════════════════════ */
.stack{display:flex; flex-direction:column; gap:13px; padding-top:16px}
.card{background:var(--board); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.card>header{display:flex; align-items:center; gap:9px; flex-wrap:wrap; padding:12px 15px; border-bottom:1px solid var(--line-soft)}
.card>header h2{font-size:14.5px; font-weight:600; margin-right:auto}
.card .body{padding:14px 15px}

.chips{display:flex; gap:7px; flex-wrap:wrap}
.chip{display:flex; align-items:center; gap:7px; padding:7px 11px; border:1px solid var(--line); border-radius:999px; background:var(--board-2); font-size:13px}
.chip .k{font-weight:600}
.chip .v{font-family:var(--f-disp); font-variant-numeric:tabular-nums; color:var(--amber); font-weight:600}
.chip.done{background:var(--ok-soft); border-color:transparent}
.chip.done .v{color:var(--ok)}
.chip .dot{width:7px; height:7px; border-radius:50%; background:var(--amber); flex:none}
.chip.done .dot{background:var(--ok)}

/* ═══ exercise board ══════════════════════════════════════ */
.ex{padding:14px 15px 15px; display:flex; flex-direction:column; gap:11px}
.ex+.ex{border-top:1px solid var(--line-soft)}
.ex-head{display:flex; align-items:flex-start; gap:12px}
.ex-id{flex:1; min-width:0}
.ex-id h3{font-size:15.5px; font-weight:600; display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.code{font-family:var(--f-disp); font-size:10.5px; font-weight:700; letter-spacing:.1em; color:var(--amber-ink); background:var(--amber-soft); padding:2px 6px; border-radius:4px}
.ex-id .goal{font-size:12.5px; color:var(--muted); margin-top:1px}
.ex-count{text-align:right; flex:none}
.ex-count .big{font-family:var(--f-disp); font-weight:700; font-size:30px; line-height:1; font-variant-numeric:tabular-nums}
.ex-count .big .of{color:var(--muted); font-size:17px; font-weight:600}
.ex-count .cap{font-size:11.5px; color:var(--muted)}
.ex.complete .ex-count .big{color:var(--ok)}

.bar{height:4px; background:var(--sunk); border-radius:99px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--amber); border-radius:99px; transition:width .35s cubic-bezier(.22,.7,.3,1)}
.ex.complete .bar i{background:var(--ok)}

.pips{display:flex; gap:8px; flex-wrap:wrap}
.pip{
  width:42px; height:42px; flex:none; cursor:pointer; padding:0;
  border-radius:50%; border:2px solid var(--pip-off); background:transparent;
  display:grid; place-items:center;
  font-family:var(--f-disp); font-size:14px; font-weight:700; color:var(--muted);
  transition:background .16s, border-color .16s, color .16s, transform .12s;
}
.pip:hover{border-color:var(--amber); color:var(--amber)}
.pip[aria-checked="true"]{background:var(--amber); border-color:var(--amber); color:var(--on-accent)}
.pip[aria-checked="true"]:active{transform:scale(.92)}
.pip.next{border-color:var(--amber); border-style:dashed; color:var(--amber)}
.ex.complete .pip[aria-checked="true"]{background:var(--ok); border-color:var(--ok); color:var(--on-ok)}

.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.btn{
  appearance:none; cursor:pointer; border-radius:9px; padding:10px 15px;
  border:1px solid var(--line); background:var(--board-2); color:var(--ink);
  font-size:14px; font-weight:500; transition:background .15s, border-color .15s;
}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--amber); border-color:var(--amber); color:var(--on-accent); font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px; font-size:13px}
.btn.danger{color:var(--fail); border-color:var(--fail); background:transparent}
.btn.wide{width:100%; justify-content:center}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.grow{flex:1}

input[type=text],input[type=number],input[type=time],select,textarea{
  background:var(--board-2); border:1px solid var(--line); border-radius:9px;
  padding:9px 10px; width:100%;
}
textarea{font-family:var(--f-mono); font-size:12px; line-height:1.5; resize:vertical}
input[type=number]{font-family:var(--f-disp); font-variant-numeric:tabular-nums}
label.f{display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--muted)}
.w-sm{max-width:104px} .w-md{max-width:160px}

.log{display:flex; gap:5px; flex-wrap:wrap}
.stamp{font-family:var(--f-mono); font-size:11px; color:var(--ink-2); background:var(--sunk); border-radius:4px; padding:2px 6px}

/* ═══ partner ═════════════════════════════════════════════ */
.mate{display:flex; align-items:center; gap:12px; padding:12px 15px}
.mate+.mate{border-top:1px solid var(--line-soft)}
.mate-b{flex:1; min-width:0; display:flex; flex-direction:column; gap:6px}
.mate-t{display:flex; align-items:baseline; gap:8px}
.mate-t b{font-size:14.5px; font-weight:600}
.mate-t .s{font-size:12px; color:var(--muted); margin-left:auto; white-space:nowrap}
.mate-r{font-family:var(--f-disp); font-weight:700; font-size:22px; font-variant-numeric:tabular-nums; flex:none}
.mate.done .mate-r{color:var(--ok)}
.mini{display:flex; gap:4px; flex-wrap:wrap}
.mini span{font-size:11.5px; color:var(--muted); background:var(--board-2); border-radius:4px; padding:1px 6px}
.mini span.ok{color:var(--ok); background:var(--ok-soft)}

/* ═══ stats ═══════════════════════════════════════════════ */
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:11px}
.tile{border:1px solid var(--line); border-radius:var(--r); padding:12px 13px; background:var(--board-2)}
.tile .v{font-family:var(--f-disp); font-size:27px; font-weight:700; line-height:1.05; font-variant-numeric:tabular-nums}
.tile .v small{font-size:14px; color:var(--muted); font-weight:600}
.meter{height:6px; background:var(--sunk); border-radius:99px; overflow:hidden; margin-top:8px}
.meter i{display:block; height:100%; background:var(--cyan); border-radius:99px}
.meter.amber i{background:var(--amber)}

table{width:100%; border-collapse:collapse; font-size:13px}
th,td{padding:8px 9px; text-align:right; border-bottom:1px solid var(--line-soft); white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:11.5px; color:var(--muted); font-weight:600}
tbody tr:last-child td{border-bottom:0}
td.n{font-family:var(--f-disp); font-variant-numeric:tabular-nums; font-weight:600}
.scrollx{overflow-x:auto}

.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.cal .dow{font-size:10.5px; color:var(--muted); text-align:center; padding-bottom:2px}
.cell{
  aspect-ratio:1; border-radius:6px; background:var(--sunk); border:1px solid transparent;
  display:grid; place-items:center; font-family:var(--f-disp); font-size:12px;
  color:var(--muted); font-variant-numeric:tabular-nums; position:relative;
}
.cell.pad{background:transparent}
.cell.l1{background:color-mix(in srgb,var(--amber) 20%,var(--sunk)); color:var(--ink-2)}
.cell.l2{background:color-mix(in srgb,var(--amber) 42%,var(--sunk)); color:var(--ink)}
.cell.l3{background:color-mix(in srgb,var(--amber) 68%,var(--sunk)); color:var(--on-accent)}
.cell.l4{background:var(--ok); color:var(--on-ok)}
.cell.today{border-color:var(--ink)}
.cell.fail::after{content:""; position:absolute; right:3px; bottom:3px; width:5px; height:5px; border-radius:50%; background:var(--fail)}
.legend{display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); margin-top:10px; flex-wrap:wrap}
.legend i{width:13px; height:13px; border-radius:4px; display:inline-block}

/* ═══ history ═════════════════════════════════════════════ */
details.day{border:1px solid var(--line); border-radius:var(--r); background:var(--board)}
details.day+details.day{margin-top:7px}
details.day>summary{cursor:pointer; padding:11px 13px; display:flex; align-items:center; gap:9px; list-style:none}
details.day>summary::-webkit-details-marker{display:none}
details.day>summary .d{font-family:var(--f-disp); font-weight:600; font-size:14.5px; min-width:92px}
details.day>summary .pct{font-family:var(--f-disp); font-weight:700; margin-left:auto; font-variant-numeric:tabular-nums}
.tag{font-size:10.5px; font-weight:700; letter-spacing:.04em; padding:2px 7px; border-radius:4px}
.tag.ok{background:var(--ok-soft); color:var(--ok)}
.tag.fail{background:var(--fail-soft); color:var(--fail)}
.tag.live{background:var(--amber-soft); color:var(--amber-ink)}
.day-body{padding:0 13px 12px; display:flex; flex-direction:column; gap:9px}
.day-ex{border-top:1px solid var(--line-soft); padding-top:8px}
.day-ex .t{display:flex; gap:8px; align-items:baseline; font-size:13.5px}
.day-ex .t b{font-weight:600}
.day-ex .t span{margin-left:auto; font-family:var(--f-disp); font-variant-numeric:tabular-nums; font-weight:600}

/* ═══ settings ════════════════════════════════════════════ */
.ed{display:grid; grid-template-columns:1.5fr repeat(3,minmax(60px,.5fr)) auto; gap:8px; align-items:end}
.ed+.ed{margin-top:10px; padding-top:10px; border-top:1px solid var(--line-soft)}
@media (max-width:640px){
  .ed{grid-template-columns:1fr 1fr 1fr}
  .ed .full{grid-column:1/-1}
  .ed .del{grid-column:1/-1; justify-self:start}
}
.note{font-size:12.5px; color:var(--ink-2); background:var(--board-2); border-left:2px solid var(--amber); padding:9px 12px; border-radius:0 7px 7px 0}
.note.warn{border-left-color:var(--fail)}
.sw{display:flex; align-items:center; gap:9px; font-size:13.5px; cursor:pointer}
.sw input{width:auto; margin:0; accent-color:var(--amber); transform:scale(1.15)}
.listrow{display:flex; gap:9px; align-items:center; justify-content:space-between; padding:9px 0; flex-wrap:wrap}
.listrow+.listrow{border-top:1px solid var(--line-soft)}
.where{display:flex; align-items:center; gap:8px; font-size:13px}
.where .badge{font-size:11px; font-weight:700; padding:3px 8px; border-radius:5px; background:var(--ok-soft); color:var(--ok)}
.where .badge.local{background:var(--amber-soft); color:var(--amber-ink)}
.where .badge.none{background:var(--fail-soft); color:var(--fail)}

/* ═══ gate / modal / toast ════════════════════════════════ */
.veil{
  position:fixed; inset:0; z-index:70; background:rgba(10,14,18,.55);
  display:grid; place-items:center; padding:18px;
  -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
}
.sheet{
  background:var(--board); border:1px solid var(--line); border-radius:16px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.5);
  width:100%; max-width:400px; max-height:86vh; overflow-y:auto;
  padding:20px; display:flex; flex-direction:column; gap:14px;
}
.sheet h2{font-size:18px}
.sheet .m-body{display:flex; flex-direction:column; gap:10px}
.sheet .m-act{display:flex; gap:8px; flex-wrap:wrap}
.sheet .m-act .btn{flex:1; min-width:96px; text-align:center}
.pickbtn{
  display:flex; align-items:center; gap:11px; width:100%; text-align:left; cursor:pointer;
  padding:11px 12px; border:1px solid var(--line); border-radius:11px; background:var(--board-2);
  font-size:14.5px; font-weight:600;
}
.pickbtn:hover{border-color:var(--amber)}
.pickbtn small{margin-left:auto; font-weight:400; color:var(--muted); font-size:12px}
#toasts{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom)); z-index:80; display:flex; flex-direction:column; gap:8px; width:max-content; max-width:92vw}
@media (max-width:640px){#toasts{bottom:calc(76px + env(safe-area-inset-bottom))}}
.toast{background:var(--ink); color:var(--bg); padding:10px 15px; border-radius:9px; font-size:13.5px; box-shadow:0 10px 30px -10px rgba(0,0,0,.5); animation:rise .2s ease-out}
.toast.alarm{background:var(--amber); color:var(--on-accent); font-weight:600}
@keyframes rise{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}
.empty{padding:24px 14px; text-align:center; color:var(--muted); font-size:13.5px}
.boot{display:grid; place-items:center; min-height:60vh; gap:10px; color:var(--muted); font-size:14px}
</style>
</head>
<body>

<script>
"use strict";

/* ═════════════════════════════════════════════════════════════
   1. 저장소 — 서버(db) 우선, 안 되면 이 기기(localStorage),
      그것도 막히면 메모리. 문서 경로는 세 모드가 동일하다.
        profiles/<pid>          {id,name,slot,createdAt}
        config/<pid>            {pid,exercises,routines,remindH,...}
        days/<pid>__<YYYY-MM-DD>{pid,date,goals,sets,run,finalized,failed}
   ════════════════════════════════════════════════════════════ */
const LKEY = "scoreboard.v2";
const V1KEY = "set-scoreboard.v1";
const MEKEY = "scoreboard.me";
const ROOMKEY = "scoreboard.room";
const MAX_BACKFILL = 60;

/* ── 공유 저장소(Supabase) 설정 ───────────────────────────────
   GitHub Pages처럼 일반 웹 주소로 열었을 때 두 사람이 기록을
   공유하기 위한 저장소. 비워 두면 이 기기 저장으로 동작한다.

   anon 키는 공개되는 것이 전제다. 실제 방어선은 두 겹이다.
     · entries 테이블은 RLS로 직접 접근이 전면 차단돼 있고,
       security definer 함수 세 개만이 통로다.
     · 그 함수들은 방 코드(128비트 난수)를 인자로 요구한다.
       방 코드는 저장소에 넣지 않고 초대 링크(#r=…)로만 오간다.
   준비: supabase-setup.sql 을 Supabase SQL Editor에 붙여넣고 실행. */
const SUPABASE_URL = "";        // 예: https://xxxxxxxxxxxx.supabase.co
const SUPABASE_ANON_KEY = "";   // Project Settings → API → anon public

const Store = {
  mode: "memory",      // "cloud" | "supa" | "local" | "memory"
  db: null,
  room: null,
  docs: new Map(),     // 모든 모드의 읽기 캐시
  lastWriteAt: 0,

  /** 여러 기기·두 사람이 같은 기록을 보는 모드인가 */
  get shared(){ return this.mode === "cloud" || this.mode === "supa"; },

  async init(){
    // 1) Claude 아티팩트 뷰어 안이면 전용 서버 저장소를 쓴다
    try{
      if(window.claude && typeof window.claude.use === "function"){
        this.db = await Promise.race([
          window.claude.use("db"),
          new Promise(r => setTimeout(()=>r(null), 8000))
        ]);
      }
    }catch(e){ this.db = null; }
    if(this.db){ this.mode = "cloud"; return; }

    // 2) 일반 웹 주소 + Supabase 설정이 있으면 공유 저장소
    if(SUPABASE_URL && SUPABASE_ANON_KEY){
      this.room = readRoom() || newRoom();
      rememberRoom(this.room);
      try{
        await this.supaLoad();
        this.mode = "supa";
        return;
      }catch(e){
        warnOnce("공유 저장소에 연결하지 못해 이 기기 저장으로 전환했습니다.");
      }
    }

    // 3) 이 기기에만
    try{
      localStorage.setItem("__probe","1"); localStorage.removeItem("__probe");
      this.mode = "local";
      const raw = localStorage.getItem(LKEY);
      if(raw) for(const [k,v] of Object.entries(JSON.parse(raw).docs || {})) this.docs.set(k,v);
    }catch(e){ this.mode = "memory"; }
  },

  /* ── Supabase: SDK 없이 PostgREST의 RPC만 호출한다 ── */
  async supaRpc(fn, body){
    const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + fn, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    });
    if(!res.ok){
      const t = await res.text().catch(()=>"");
      const err = new Error("Supabase " + res.status + " " + t.slice(0,160));
      err.status = res.status;
      throw err;
    }
    const txt = await res.text();
    return txt ? JSON.parse(txt) : null;
  },
  async supaLoad(){
    const rows = (await this.supaRpc("sb_list", { p_room: this.room })) || [];
    const seen = new Set();
    for(const r of rows){ this.docs.set(r.path, r.data); seen.add(r.path); }
    for(const k of [...this.docs.keys()]) if(!seen.has(k)) this.docs.delete(k);
    return rows.length;
  },
  /** 상대방의 변경을 끌어온다. 내가 막 쓴 직후에는 건너뛴다 */
  async refresh(){
    if(this.mode !== "supa") return false;
    if(pending.size || Date.now()-this.lastWriteAt < 3000) return false;
    try{ await this.supaLoad(); return true; }
    catch(e){ return false; }
  },

  persistLocal(){
    if(this.mode !== "local") return;
    try{ localStorage.setItem(LKEY, JSON.stringify({docs:Object.fromEntries(this.docs)})); }
    catch(e){ warnOnce("이 기기에 더 저장할 공간이 없습니다. JSON 백업을 받아 두세요."); }
  },
  async get(path){
    if(this.mode === "cloud"){
      const s = await this.db.doc(path).get();
      const d = s.exists ? s.data() : null;
      if(d) this.docs.set(path, d); else this.docs.delete(path);
      return d;
    }
    return this.docs.get(path) || null;
  },
  async set(path, doc){
    this.docs.set(path, doc);
    this.lastWriteAt = Date.now();
    if(this.mode === "cloud"){ await this.db.doc(path).set(doc); return; }
    if(this.mode === "supa"){
      await this.supaRpc("sb_put", { p_room:this.room, p_path:path, p_data:doc });
      return;
    }
    this.persistLocal();
  },
  async del(path){
    this.docs.delete(path);
    this.lastWriteAt = Date.now();
    if(this.mode === "cloud"){ await this.db.doc(path).delete(); return; }
    if(this.mode === "supa"){
      await this.supaRpc("sb_del", { p_room:this.room, p_path:path });
      return;
    }
    this.persistLocal();
  },
  /** 컬렉션 전체를 한 번 읽어 캐시에 채운다 */
  async loadAll(coll){
    if(this.mode === "cloud"){
      const snap = await this.db.collection(coll).get();
      const out = [];
      for(const d of snap.docs){ const b = d.data(); this.docs.set(coll+"/"+d.id, b); out.push(b); }
      return out;
    }
    const out = [];
    for(const [k,v] of this.docs) if(k.startsWith(coll+"/")) out.push(v);
    return out;
  },
  /** cloud에서만 실시간. 다른 기기·상대방의 변경을 밀어준다 */
  watch(coll, filter, cb){
    if(this.mode !== "cloud") return ()=>{};
    let q = this.db.collection(coll);
    if(filter) q = q.where(filter.field, filter.op, filter.value);
    return q.onSnapshot(snap=>{
      for(const d of snap.docs) this.docs.set(coll+"/"+d.id, d.data());
      cb();
    }, err=>{
      if(err.code === "revoked") warnOnce("서버 연결 권한이 해제되었습니다. 화면을 새로 고쳐 주세요.");
      else if(err.code === "resource_exhausted") warnOnce("요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.");
    });
  }
};

/* 쓰기 모으기 — 핍을 연타해도 마지막 상태 한 번만 보낸다 */
const pending = new Map();
let flushTimer = null, writeErr = false;
function queueWrite(path, doc){
  pending.set(path, doc);
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flushWrites, 400);
}
async function flushWrites(){
  if(!pending.size) return;
  const items = [...pending]; pending.clear();
  for(const [p,d] of items){
    try{ await Store.set(p,d); writeErr = false; }
    catch(e){
      if(!writeErr){
        writeErr = true;
        const c = e && e.code, st = e && e.status;
        toast(c === "quota_exceeded" ? "저장 공간이 가득 찼습니다. 오래된 기록을 지워 주세요."
            : c === "revoked" ? "저장 권한이 해제되었습니다. 새로 고쳐 주세요."
            : (st === 401 || st === 403) ? "공유 저장소가 접근을 거부했습니다. 초대 링크가 올바른지 확인해 주세요."
            : "저장에 실패했습니다. 연결을 확인해 주세요.", 6000);
      }
    }
  }
}
addEventListener("pagehide", ()=>{ clearTimeout(flushTimer); flushWrites(); });
document.addEventListener("visibilitychange", ()=>{ if(document.hidden){ clearTimeout(flushTimer); flushWrites(); } });

/* ═════════════════════════════════════════════════════════════
   2. 날짜·계산 유틸
   ════════════════════════════════════════════════════════════ */
const pad = n => String(n).padStart(2,"0");
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const todayKey = () => dkey(new Date());
const DOW = ["월","화","수","목","금","토","일"];
const dowIdx = d => (d.getDay()+6)%7;
const mondayOf = d => addDays(d, -dowIdx(d));
const fmtDate = k => { const d = fromKey(k); return `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[dowIdx(d)]})`; };
const fmtClock = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const nfmt = n => (Math.round(n*10)/10).toLocaleString("ko-KR");
const dayPath = (pid,date) => `days/${pid}__${date}`;

const DEFAULT_EX = () => ([
  { id:"situp",  name:"윗몸일으키기", code:"SIT", kind:"sets", sets:8, reps:25 },
  { id:"pushup", name:"팔굽혀펴기",   code:"PSH", kind:"sets", sets:8, reps:15 },
  { id:"squat",  name:"스쿼트",       code:"SQT", kind:"sets", sets:8, reps:30 },
  { id:"run",    name:"러닝",         code:"RUN", kind:"dist", target:7, unit:"km" }
]);
const DEFAULT_CONFIG = pid => ({ pid, exercises:DEFAULT_EX(), routines:[], remindH:20, remindM:0, remindOn:true });

function frac(goal, day){
  if(goal.kind === "sets"){
    const n = (day.sets?.[goal.id] || []).length;
    return goal.sets > 0 ? Math.min(1, n/goal.sets) : 1;
  }
  const r = day.run?.[goal.id];
  if(goal.target > 0) return Math.min(1, (r?.km || 0)/goal.target);
  return r?.done ? 1 : 0;
}
const dayRate = day => (!day || !day.goals?.length) ? 0
  : day.goals.reduce((s,g)=>s+frac(g,day),0) / day.goals.length;
const dayComplete = day => !!day && !!day.goals?.length && day.goals.every(g=>frac(g,day) >= 1);
const dayHasFail = day => !!day && !!day.failed && Object.values(day.failed).some(v=>v>0);
function dayUnits(day){
  let done = 0, target = 0;
  if(day) for(const g of day.goals){
    if(g.kind === "sets"){ target += g.sets; done += Math.min(g.sets,(day.sets?.[g.id]||[]).length); }
    else { target += 1; done += frac(g,day); }
  }
  return {done,target};
}
function remainText(g, day){
  if(frac(g,day) >= 1) return null;
  if(g.kind === "sets"){
    const left = g.sets - (day.sets?.[g.id]||[]).length;
    return `${left}세트 · ${left*g.reps}회`;
  }
  return `${nfmt(Math.max(0, g.target-(day.run?.[g.id]?.km||0)))}${g.unit}`;
}

/* ═════════════════════════════════════════════════════════════
   3. 앱 상태
   ════════════════════════════════════════════════════════════ */
let PROFILES = [];                 // [{id,name,slot,createdAt}]
let ME = null;                     // 내 프로필
let CFG = new Map();               // pid -> config
let HISTVIEW = null;               // 기록 탭에서 보고 있는 pid
let calMonth = (()=>{ const d = new Date(); return {y:d.getFullYear(), m:d.getMonth()}; })();

const $ = s => document.querySelector(s);
const el = (t,c,h) => { const n = document.createElement(t); if(c) n.className = c; if(h != null) n.innerHTML = h; return n; };
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const cfgOf = pid => CFG.get(pid) || DEFAULT_CONFIG(pid);
const dayOf = (pid,date) => Store.docs.get(dayPath(pid,date)) || null;

function myDay(){
  const k = todayKey();
  let d = dayOf(ME.id, k);
  if(!d){
    d = { pid:ME.id, date:k, goals:cfgOf(ME.id).exercises.map(e=>({...e})), sets:{}, run:{}, finalized:false, failed:{} };
    Store.docs.set(dayPath(ME.id,k), d);
    queueWrite(dayPath(ME.id,k), d);
  }
  return d;
}
function saveDay(day){
  day.updatedAt = Date.now();
  Store.docs.set(dayPath(day.pid, day.date), day);
  queueWrite(dayPath(day.pid, day.date), day);
}
function saveCfg(pid){
  const c = cfgOf(pid); CFG.set(pid,c);
  Store.docs.set("config/"+pid, c);
  queueWrite("config/"+pid, c);
}
function daysOf(pid){
  const out = [];
  for(const [k,v] of Store.docs) if(k.startsWith("days/"+pid+"__")) out.push(v);
  return out.sort((a,b)=>a.date < b.date ? -1 : 1);
}
function streakOf(pid){
  let n = 0, d = new Date();
  if(!dayComplete(dayOf(pid,dkey(d)))) d = addDays(d,-1);
  for(let i=0;i<3650;i++){
    if(dayComplete(dayOf(pid,dkey(d)))){ n++; d = addDays(d,-1); }
    else break;
  }
  return n;
}

/* ═════════════════════════════════════════════════════════════
   4. 자정 마감 — 못 채운 세트를 그날 기록에 "실패"로 확정
   ════════════════════════════════════════════════════════════ */
function finalizePast(){
  const tk = todayKey();
  const cfg = cfgOf(ME.id);
  let flagged = 0;
  for(let i=1;i<=MAX_BACKFILL;i++){
    const k = dkey(addDays(new Date(), -i));
    let d = dayOf(ME.id,k);
    if(!d){
      if(!(cfg.startedAt && k >= cfg.startedAt)) continue;   // 시작 이전 날은 만들지 않는다
      d = { pid:ME.id, date:k, goals:cfg.exercises.map(e=>({...e})), sets:{}, run:{}, finalized:false, failed:{} };
    }
    if(d.finalized) continue;
    d.failed = {};
    for(const g of d.goals){
      if(g.kind === "sets"){
        const miss = Math.max(0, g.sets - (d.sets?.[g.id]||[]).length);
        if(miss) d.failed[g.id] = miss;
      }else{
        const km = d.run?.[g.id]?.km || 0;
        if(km < g.target) d.failed[g.id] = Math.round((g.target-km)*100)/100;
      }
    }
    d.finalized = true;
    saveDay(d);
    if(dayHasFail(d)) flagged++;
  }
  if(flagged) toast(`하루가 마감되어 미완료 세트가 ${flagged}일치 실패로 기록됐습니다.`, 5000);
}

function modal({title, build, actions, dismissable = true}){
  return new Promise(resolve=>{
    const veil = el("div","veil");
    const sheet = el("div","sheet");
    sheet.setAttribute("role","dialog");
    sheet.setAttribute("aria-modal","true");
    if(title) sheet.append(el("h2",null,esc(title)));
    const body = el("div","m-body");
    const ctx = {};
    if(build) build(body, ctx);
    sheet.append(body);
    const done = v => { veil.remove(); document.removeEventListener("keydown",onKey); resolve(v); };
    if(actions?.length){
      const bar = el("div","m-act");
      for(const a of actions){
        const b = el("button","btn"+(a.kind ? " "+a.kind : ""), esc(a.label));
        b.type = "button";
        b.onclick = ()=>{ const v = a.value !== undefined ? a.value : (ctx.value ? ctx.value() : true); done(v); };
        bar.append(b);
      }
      sheet.append(bar);
    }
    ctx.close = done;
    veil.append(sheet);
    veil.onclick = e => { if(e.target === veil && dismissable) done(null); };
    const onKey = e => { if(e.key === "Escape" && dismissable) done(null); };
    document.addEventListener("keydown",onKey);
    $("#modal-root").append(veil);
    setTimeout(()=>{ (sheet.querySelector("input,button.pickbtn,textarea") || sheet.querySelector("button"))?.focus(); }, 30);
  });
}
const ask = (title, msg, okLabel = "확인", kind = "primary") => modal({

/* ═════════════════════════════════════════════════════════════
   6. 프로필 — 뷰어 식별 권한이 없으므로 직접 고른다.
      선택은 URL 해시(#p=…)와 이 기기에 함께 남겨서
      홈 화면 바로가기마다 다른 사람으로 열 수 있다.
   ════════════════════════════════════════════════════════════ */
/* 주소 해시에 p(나)와 r(방 코드)을 함께 싣는다. 둘을 서로
   지우지 않도록 항상 병합해서 쓴다. */
function hashParams(){
  const out = {};
  for(const part of location.hash.replace(/^#/,"").split("&")){
    const i = part.indexOf("=");
    if(i > 0) out[part.slice(0,i)] = part.slice(i+1);
  }
  return out;
}
function writeHash(patch){
  const h = Object.assign(hashParams(), patch);
  const s = Object.entries(h).filter(([,v])=>v).map(([k,v])=>k+"="+v).join("&");
  try{ history.replaceState(null,"", location.pathname + location.search + (s ? "#"+s : "")); }
  catch(e){}
}
function readSavedMe(){
  const h = hashParams();
  if(h.p) return h.p;
  try{ return localStorage.getItem(MEKEY); }catch(e){ return null; }
}
function rememberMe(pid){
  try{ localStorage.setItem(MEKEY,pid); }catch(e){}
  writeHash({ p: pid });
}
/* 방 코드 — 이 값을 아는 사람만 기록을 읽고 쓸 수 있다.
   저장소(코드)에는 절대 넣지 않고 초대 링크로만 전달한다. */
function newRoom(){
  const a = new Uint8Array(16);
  crypto.getRandomValues(a);
  return [...a].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function readRoom(){
  const h = hashParams();
  if(h.r && /^[a-f0-9]{32}$/.test(h.r)) return h.r;
  try{
    const v = localStorage.getItem(ROOMKEY);
    return (v && /^[a-f0-9]{32}$/.test(v)) ? v : null;
  }catch(e){ return null; }
}
function rememberRoom(room){
  try{ localStorage.setItem(ROOMKEY, room); }catch(e){}
  writeHash({ r: room });
}
function inviteLink(){
  return location.origin + location.pathname + "#r=" + (Store.room || "");
}

async function gate(){
  const items = PROFILES.map(p=>({
    label:p.name, value:p.id,

      // 빈 방으로 들어온 경우, 초대 링크를 안 쓴 것일 수 있다
      if(!PROFILES.length && Store.mode === "supa"){
        const hint = el("div","note");
        hint.innerHTML = "이미 쓰던 기록이 있다면 이 화면이 아니라 <b>초대 링크</b>로 열어야 합니다. "
          + "지금 새 방이 만들어진 상태라, 그냥 진행하면 빈 기록으로 시작합니다.";
        b.append(hint);
        const join = el("button","btn sm ghost wide","초대 링크 / 방 코드 입력");
        join.type = "button";
        join.onclick = async ()=>{
          const v = await askText("방 코드 입력","초대 링크를 그대로 붙여넣어도 됩니다","");
          if(!v) return;
          const code = (v.match(/[a-f0-9]{32}/) || [])[0];
          if(!code){ toast("32자리 방 코드를 찾지 못했습니다."); return; }
          rememberRoom(code);
          location.reload();
        };
        b.append(join);
      }
      for(const it of items){
        const btn = el("button","pickbtn");
        btn.type = "button";
        const p = PROFILES.find(x=>x.id === it.value);
        btn.innerHTML = (p ? `<span class="av${p.slot ? " p2" : ""}">${esc(p.name.slice(0,1))}</span>` : "")
          + `<span>${esc(it.label)}</span>` + (it.note ? `<small>${esc(it.note)}</small>` : "");
        btn.onclick = ()=> ctx.close(it.value);
        b.append(btn);
      }
    },
    actions: ME ? [{label:"취소", value:null, kind:"ghost"}] : []
  });
  if(pick === null) return;
  if(pick === "__new"){
    const name = await askText("새 프로필","이름", "");
    if(!name){ return gate(); }
    ME = await createProfile(name);
    if(PROFILES.length === 1) await migrateV1();
  }else{
    ME = PROFILES.find(p=>p.id === pick);
  }
  rememberMe(ME.id);
  HISTVIEW = ME.id;
  await afterIdentity();
}
/** 이전 버전(단일 사용자, 이 기기 저장)의 기록을 첫 프로필로 옮긴다 */
async function migrateV1(){
  let old = null;
  try{ old = JSON.parse(localStorage.getItem(V1KEY) || "null"); }catch(e){}
  if(!old || !old.days || !Object.keys(old.days).length) return;
  const cfg = cfgOf(ME.id);
  if(old.exercises?.length) cfg.exercises = old.exercises;
  if(old.routines?.length) cfg.routines = old.routines;
  const dates = Object.keys(old.days).sort();
  cfg.startedAt = dates[0];
  CFG.set(ME.id,cfg);
  await Store.set("config/"+ME.id,cfg);
  for(const [date,d] of Object.entries(old.days)){
    const doc = { pid:ME.id, date, goals:d.goals||[], sets:d.sets||{}, run:d.run||{}, finalized:!!d.finalized, failed:d.failed||{} };
    Store.docs.set(dayPath(ME.id,date), doc);
    queueWrite(dayPath(ME.id,date), doc);
  }
  toast(`이전 기록 ${dates.length}일치를 가져왔습니다.`, 5000);
}

function setsCard(g, day){

  const head = el("div","ex-head");

    list.forEach((ts,i)=> log.append(el("span","stamp",`${i+1}세트 ${fmtClock(ts)}`)));
    wrap.append(log);
  }

function distCard(g, day){
  const rec = day.run[g.id] || {};
  const km = rec.km || 0;
  const complete = frac(g,day) >= 1;
  const wrap = el("div","ex"+(complete ? " complete" : ""));

  const head = el("div","ex-head");
  const id = el("div","ex-id");
  id.append(el("h3",null,`${esc(g.name)}<span class="code">${esc(g.code||"RUN")}</span>`));
  id.append(el("div","goal",`목표 ${nfmt(g.target)}${esc(g.unit)} · 세트 없이 한 번에`));
  head.append(id);
  const cnt = el("div","ex-count");
  cnt.append(el("div","big",`${nfmt(km)}<span class="of">/${nfmt(g.target)}${esc(g.unit)}</span>`));
  cnt.append(el("div","cap", complete ? "완주" : `${nfmt(Math.max(0,g.target-km))}${g.unit} 남음`));
  head.append(cnt);
  wrap.append(head);

  const bar = el("div","bar"); bar.append(el("i"));

  wrap.append(bar);

  const kmI = el("input"); kmI.type = "number"; kmI.step = "0.01"; kmI.min = "0";
  kmI.inputMode = "decimal"; kmI.value = km || ""; kmI.placeholder = "0.00";
  const mnI = el("input"); mnI.type = "number"; mnI.step = "1"; mnI.min = "0";
  mnI.inputMode = "numeric"; mnI.value = rec.min || ""; mnI.placeholder = "0";
  const row = el("div","row");
  const l1 = el("label","f w-sm"); l1.append(document.createTextNode(`거리 (${g.unit})`), kmI);
  const l2 = el("label","f w-sm"); l2.append(document.createTextNode("시간 (분)"), mnI);
  row.append(l1,l2);

  const done = el("button","btn primary", complete ? "기록 갱신" : "완료 체크");

  done.onclick = ()=>{
    const v = parseFloat(kmI.value);
    const d = myDay();
    d.run[g.id] = { done:true, km: (isNaN(v)||v <= 0) ? g.target : v, min: parseFloat(mnI.value)||0, ts:Date.now() };
    saveDay(d); renderAll();
    toast(`${g.name} ${nfmt(d.run[g.id].km)}${g.unit} 기록`);
  };
  row.append(done);

  const gpsBtn = el("button","btn sm ghost","GPS 측정");

  gpsBtn.onclick = ()=> gpsToggle(g, gpsBtn, kmI, mnI);

  if(rec.ts){
    const clr = el("button","btn sm ghost","지우기");
    clr.type = "button"; clr.style.alignSelf = "flex-end";
    clr.onclick = async ()=>{
      if(!await ask("기록 지우기", `${g.name} 오늘 기록을 지웁니다.`,"지우기","danger")) return;
      const d = myDay(); delete d.run[g.id]; saveDay(d); renderAll();
    };
    row.append(clr);
  }
  wrap.append(row);

  const st = el("div","log");
  if(rec.ts){
    st.append(el("span","stamp",`완료 ${fmtClock(rec.ts)}`));
    if(rec.min) st.append(el("span","stamp",`${rec.min}분 · ${nfmt(rec.km/(rec.min/60))}${g.unit}/h`));
  }
  const out = el("span","stamp"); out.dataset.gps = g.id; out.style.display = "none";
  st.append(out);
  wrap.append(st);
  return wrap;
}
function toggleSet(exId, i){
  const keepFocus = document.activeElement?.classList.contains("pip");
  const day = myDay();
  const g = day.goals.find(x=>x.id === exId);
  if(!g) return;
  const list = day.sets[exId] || (day.sets[exId] = []);
  if(i < list.length) list.length = i;
  else { const now = Date.now(); while(list.length <= i && list.length < g.sets) list.push(now); }
  saveDay(day);
  renderAll();
  if(keepFocus) document.querySelector(`.pip[data-ex="${exId}"][data-i="${i}"]`)?.focus();
  if(list.length >= g.sets && i >= list.length-1) toast(`${g.name} ${g.sets}세트 완주 🎯`);
}

let gpsWatch = null, gpsData = null;
function gpsToggle(g, btn, kmI, mnI){
  const out = document.querySelector(`[data-gps="${g.id}"]`);
  if(gpsWatch !== null){
    navigator.geolocation.clearWatch(gpsWatch);
    clearInterval(gpsData.tick);
    gpsWatch = null; btn.textContent = "GPS 측정";
    toast(`GPS 측정 종료 · ${nfmt(gpsData.km)}${g.unit}`);
    gpsData = null;
    return;
  }
  if(!navigator.geolocation){
    out.style.display = ""; out.textContent = "GPS를 지원하지 않는 브라우저입니다. 거리를 직접 입력하세요.";
    return;
  }
  out.style.display = ""; out.textContent = "GPS 신호 확인 중…";
  gpsData = { km:0, last:null, t0:Date.now(), tick:null };
  gpsData.tick = setInterval(()=>{
    if(!gpsData) return;
    const min = Math.round((Date.now()-gpsData.t0)/60000);
    mnI.value = min;
    out.textContent = `GPS 측정 중 · ${nfmt(gpsData.km)}${g.unit} · ${min}분`;
  }, 5000);
  gpsWatch = navigator.geolocation.watchPosition(p=>{
    const c = p.coords;
    if(c.accuracy > 40) return;
    if(gpsData.last){
      const d = haversine(gpsData.last, c);
      if(d > 0.002 && d < 0.4) gpsData.km += d;
    }
    gpsData.last = c;
    kmI.value = (Math.round(gpsData.km*100)/100).toFixed(2);
  }, err=>{
    out.textContent = `GPS를 쓸 수 없습니다 (${err.code === 1 ? "위치 권한 거부" : "신호 없음"}). 거리를 직접 입력하세요.`;
    if(gpsData){ clearInterval(gpsData.tick); gpsData = null; }
    gpsWatch = null; btn.textContent = "GPS 측정";
  }, { enableHighAccuracy:true, maximumAge:2000, timeout:15000 });
  btn.textContent = "GPS 정지";
}
function haversine(a,b){
  const R = 6371, rad = Math.PI/180;
  const dLat = (b.latitude-a.latitude)*rad, dLon = (b.longitude-a.longitude)*rad;
  const la1 = a.latitude*rad, la2 = b.latitude*rad;
  const h = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

function tile(label, value, sub, ratio, amber){
  const n = el("div","tile");
  n.append(el("div","lbl", esc(label)), el("div","v", value), el("div","sub", esc(sub)));
  const m = el("div","meter"+(amber ? " amber" : "")); m.append(el("i"));
  m.firstChild.style.width = Math.round(Math.min(1,ratio)*100)+"%";
  n.append(m);
  return n;
}
function rangeRate(pid, from, to){
  let done = 0, target = 0, full = 0, seen = 0;
  for(let d = new Date(from); d <= to; d = addDays(d,1)){
    const k = dkey(d);
    if(k > todayKey()) break;
    const day = dayOf(pid,k);
    if(!day) continue;
    const u = dayUnits(day); done += u.done; target += u.target; seen++;
    if(dayComplete(day)) full++;
  }
  return { pct: target ? done/target : 0, full, seen };
}

function renderCal(){

function renderCum(mine){
  const agg = new Map();
  for(const day of mine) for(const g of day.goals){
    let a = agg.get(g.id);
    if(!a){ a = {name:g.name, kind:g.kind, unit:g.unit||"", sets:0, reps:0, km:0, min:0, days:0, fail:0}; agg.set(g.id,a); }
    a.name = g.name;
    if(g.kind === "sets"){
      const n = Math.min(g.sets,(day.sets?.[g.id]||[]).length);
      a.sets += n; a.reps += n*g.reps;
    }else{
      const r = day.run?.[g.id];
      if(r){ a.km += r.km||0; a.min += r.min||0; }
    }
    if(frac(g,day) >= 1) a.days++;
    a.fail += day.failed?.[g.id] || 0;
  }
  const tb = $("#cum-table");
  tb.innerHTML = `<thead><tr><th>종목</th><th>누적</th><th>완료 세트</th><th>완주일</th><th>실패</th></tr></thead>`;
  if(!agg.size){ tb.append(el("tbody",null,`<tr><td colspan="5"><div class="empty">아직 기록이 없습니다.</div></td></tr>`)); return; }
  const body = el("tbody");
  for(const a of agg.values()){
    const tot = a.kind === "sets" ? `${nfmt(a.reps)}회` : `${nfmt(a.km)}${a.unit}${a.min ? " · "+a.min+"분" : ""}`;
    body.append(el("tr",null,
      `<td>${esc(a.name)}</td><td class="n">${tot}</td><td class="n">${a.kind === "sets" ? nfmt(a.sets) : "—"}</td>`+
      `<td class="n">${a.days}일</td><td class="n" style="color:${a.fail ? "var(--fail)" : "var(--muted)"}">${a.fail ? nfmt(a.fail) : "0"}</td>`));
  }
  tb.append(body);
}
function renderRange(sel, count, mode){
  const host = $(sel); host.textContent = "";
  const now = new Date(), rows = [];
  for(let i=count-1;i>=0;i--){
    let start, end, label;
    if(mode === "week"){
      start = mondayOf(addDays(now,-7*i)); end = addDays(start,6);
      label = `${start.getMonth()+1}/${start.getDate()}–${end.getMonth()+1}/${end.getDate()}`;
    }else{
      start = new Date(now.getFullYear(), now.getMonth()-i, 1);
      end = new Date(now.getFullYear(), now.getMonth()-i+1, 0);
      label = `${start.getFullYear()}. ${pad(start.getMonth()+1)}`;
    }
    rows.push({ label, ...rangeRate(ME.id, start, end) });
  }
  if(rows.every(r=>!r.seen)){ host.append(el("div","empty","집계할 기록이 아직 없습니다.")); return; }
  const list = el("div"); list.style.cssText = "display:flex;flex-direction:column;gap:10px";
  for(const r of rows){
    const line = el("div");
    const top = el("div","row"); top.style.justifyContent = "space-between";
    top.append(el("span","mono", esc(r.label)));
    top.append(el("span","num", `${Math.round(r.pct*100)}% · 완주 ${r.full}/${r.seen}일`));
    line.append(top);
    const m = el("div","meter amber"); m.append(el("i"));
    m.firstChild.style.width = Math.round(r.pct*100)+"%";
    line.append(m);
    list.append(line);
  }
  host.append(list);
}

function renderHistory(){
  const who = $("#hist-who"); who.textContent = "";
  if(PROFILES.length > 1){
    const row = el("div","row");
    for(const p of PROFILES){
      const b = el("button","btn sm"+(p.id === HISTVIEW ? " primary" : " ghost"), esc(p.name));
      b.type = "button";
      b.onclick = ()=>{ HISTVIEW = p.id; renderHistory(); };
      row.append(b);
    }
    who.append(row);
  }
  const pid = HISTVIEW || ME.id;
  const host = $("#history"); host.textContent = "";
  const list = daysOf(pid).reverse();
  $("#hist-count").textContent = list.length ? `${list.length}일 기록` : "";
  if(!list.length){ host.append(el("div","empty","기록이 없습니다. 오늘 첫 세트를 체크해 보세요.")); return; }
  const tk = todayKey();
  for(const day of list.slice(0,120)){
    const r = dayRate(day);
    const d = el("details","day");
    if(day.date === tk) d.open = true;
    const sm = el("summary");
    sm.append(el("span","d", fmtDate(day.date)));
    if(day.date === tk) sm.append(el("span","tag live","진행 중"));
    else if(dayComplete(day)) sm.append(el("span","tag ok","완주"));
    else if(dayHasFail(day)) sm.append(el("span","tag fail","실패"));
    sm.append(el("span","pct", `${Math.round(r*100)}%`));
    d.append(sm);
    const body = el("div","day-body");
    for(const g of day.goals){
      const box = el("div","day-ex");
      const t = el("div","t");
      t.append(el("b",null,esc(g.name)));
      if(g.kind === "sets"){
        const n = (day.sets?.[g.id]||[]).length;
        t.append(el("span",null,`${n} / ${g.sets}세트 · ${n*g.reps}회`));
        box.append(t);
        const f = day.failed?.[g.id];
        if(f) box.append(el("div","sub",`실패 ${f}세트 (${f*g.reps}회 미완료)`));
        if(n){
          const log = el("div","log"); log.style.marginTop = "6px";
          day.sets[g.id].forEach((ts,i)=>log.append(el("span","stamp",`${i+1} ${fmtClock(ts)}`)));
          box.append(log);
        }
      }else{
        const rec = day.run?.[g.id];
        t.append(el("span",null,`${nfmt(rec?.km||0)} / ${nfmt(g.target)}${esc(g.unit)}`));
        box.append(t);
        const bits = [];
        if(rec?.min) bits.push(rec.min+"분");
        if(rec?.ts) bits.push(fmtClock(rec.ts)+" 기록");
        if(day.failed?.[g.id]) bits.push(`${nfmt(day.failed[g.id])}${g.unit} 미달`);
        if(bits.length) box.append(el("div","sub", bits.join(" · ")));
      }
      body.append(box);
    }
    d.append(body);
    host.append(d);
  }
}

      if(!await ask("방 이동","이 기기를 그 방의 기록으로 바꿉니다. 지금 방의 기록은 서버에 그대로 남습니다.","이동")) return;
      rememberRoom(code);
      location.reload();
    };
    row.append(join);
    box.append(row);
    host.append(box);
    return;
  }

  if(Store.mode !== "cloud"){
    host.append(el("div","note warn", Store.mode === "memory"
      ? "시크릿 모드이거나 브라우저가 저장을 차단한 상태입니다. 일반 창에서 열어 주세요."
      : "공유 저장소가 설정되지 않았거나 연결에 실패했습니다. 지금 기록은 JSON 백업으로 옮길 수 있습니다."));
  }
}
function fieldText(label, val, onchange){
  const l = el("label","f", esc(label));
  const i = el("input"); i.type = "text"; i.value = val;
  i.onchange = ()=> onchange(i.value);
  l.append(i); return l;
}
function fieldNum(label, val, step, min, onchange){
  const l = el("label","f", esc(label));
  const i = el("input"); i.type = "number"; i.value = val; i.step = step; i.min = min;
  i.inputMode = step < 1 ? "decimal" : "numeric";
  i.onchange = ()=> onchange(parseFloat(i.value)||0);
  l.append(i); return l;
}
/** 목표 변경을 오늘 기록에 반영. 이미 완료한 세트는 유지한다 */
function syncGoals(rerender){
  const d = myDay();
  d.goals = cfgOf(ME.id).exercises.map(e=>({...e}));
  for(const g of d.goals){
    if(g.kind === "sets" && d.sets[g.id]) d.sets[g.id] = d.sets[g.id].slice(0, g.sets);
  }
  saveDay(d);
  if(rerender) renderAll();
}

/* ── 알림 ────────────────────────────────────────────────── */
let lastNotified = null;
function notify(title, body){
  if("Notification" in window && Notification.permission === "granted"){
    try{ new Notification(title,{ body, tag:"scoreboard" }); return; }catch(e){}
  }
  toast(`${title} — ${body}`, 12000, true);
}
function checkReminder(){
  if(!ME) return;
  const cfg = cfgOf(ME.id);
  if(!cfg.remindOn) return;
  const tk = todayKey();
  if(lastNotified === tk) return;
  const now = new Date();
  if(now.getHours()*60+now.getMinutes() < cfg.remindH*60+cfg.remindM) return;
  const day = myDay();
  if(dayComplete(day)) return;
  const left = day.goals.map(g=>{ const t = remainText(g,day); return t ? `${g.name} ${t}` : null; }).filter(Boolean);
  if(!left.length) return;
  lastNotified = tk;
  notify("남은 세트가 있습니다", left.join(" · "));
}

/* ── 내보내기 / 가져오기 ─────────────────────────────────── */
let dlNs = null;
const dlReady = (async ()=>{
  try{ if(window.claude?.use) dlNs = await window.claude.use("downloads"); }
  catch(e){ dlNs = null; }
  return dlNs;
})();
const embedded = (()=>{ try{ return window.top !== window.self; }catch(e){ return true; } })();

async function saveFile(filename, text){
  if(dlNs){
    try{
      const r = await dlNs.save({ filename, data:text });
      if(r.status === "saved") toast(`${filename} 저장했습니다.`);
      return;
    }catch(err){
      const c = err && err.code;
      if(c === "declined") return;
      if(c === "rate_limited"){ toast("저장 확인창이 이미 열려 있습니다. 잠시 후 다시 시도하세요."); return; }
      toast("파일로 저장할 수 없습니다. 클립보드 복사를 사용하세요.");
      return;
    }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text],{type:"text/plain;charset=utf-8"}));
  a.download = filename; a.click(); URL.revokeObjectURL(a.href);
  toast(`${filename} 저장했습니다.`);
}
function buildJSON(){
  const docs = {};
  for(const [k,v] of Store.docs) docs[k] = v;
  return JSON.stringify({ format:"scoreboard.v2", exportedAt:new Date().toISOString(), docs }, null, 2);
}
function buildCSV(){
  const q = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const rows = [["person","date","exercise","kind","goal_sets","goal_reps","goal_target","unit","done_sets","done_reps","distance","minutes","complete","failed","timestamps"]];
  const all = [];
  for(const [k,v] of Store.docs) if(k.startsWith("days/")) all.push(v);
  all.sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : (a.pid < b.pid ? -1 : 1));
  for(const day of all){
    const who = PROFILES.find(p=>p.id === day.pid)?.name || day.pid;
    for(const g of day.goals){
      if(g.kind === "sets"){
        const ts = day.sets?.[g.id] || [];
        rows.push([who, day.date, g.name, "sets", g.sets, g.reps, "", "", ts.length, ts.length*g.reps, "", "",
          ts.length >= g.sets ? 1 : 0, day.failed?.[g.id] || 0,
          ts.map(t=>{ const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }).join("|")]);
      }else{
        const r = day.run?.[g.id] || {};
        rows.push([who, day.date, g.name, "distance", "", "", g.target, g.unit, "", "", r.km||0, r.min||0,
          frac(g,day) >= 1 ? 1 : 0, day.failed?.[g.id] || 0, r.ts ? fmtClock(r.ts) : ""]);
      }
    }
  }
  return rows.map(r=>r.map(q).join(",")).join("\n");
}
function showIO(title, text, filename){
  const host = $("#io"); host.textContent = "";
  const box = el("div"); box.style.cssText = "display:flex;flex-direction:column;gap:8px";
  box.append(el("div","lbl", esc(title)));
  const ta = el("textarea"); ta.rows = 8; ta.value = text; ta.readOnly = true;
  box.append(ta);
  const row = el("div","row");
  const cp = el("button","btn sm primary","클립보드 복사"); cp.type = "button";
  cp.onclick = async ()=>{
    try{ await navigator.clipboard.writeText(text); toast("복사했습니다."); }
    catch(e){ ta.select(); toast("자동 복사가 막혔습니다. 선택된 내용을 직접 복사하세요."); }
  };
  row.append(cp);
  const dl = el("button","btn sm","파일로 저장"); dl.type = "button";
  dl.onclick = ()=> saveFile(filename, text);
  if(embedded && !dlNs){ dl.style.display = "none"; dlReady.then(ns=>{ if(ns) dl.style.display = ""; }); }
  row.append(dl);
  const cl = el("button","btn sm ghost","닫기"); cl.type = "button";
  cl.onclick = ()=>{ host.textContent = ""; };
  row.append(cl);
  box.append(row);
  host.append(box);
}
function importUI(){
  const host = $("#io"); host.textContent = "";
  const box = el("div"); box.style.cssText = "display:flex;flex-direction:column;gap:8px";
  box.append(el("div","lbl","백업 JSON 붙여넣기"));
  const ta = el("textarea"); ta.rows = 7; ta.placeholder = '{"format":"scoreboard.v2",…}';
  box.append(ta);
  const row = el("div","row");
  const go = el("button","btn sm primary","가져오기"); go.type = "button";
  go.onclick = async ()=>{
    let p;
    try{ p = JSON.parse(ta.value); }
    catch(err){ toast("읽을 수 없는 JSON입니다."); return; }
    const docs = p?.docs || (p?.days ? null : null);
    if(!docs){ toast("이 앱의 백업 형식이 아닙니다."); return; }
    if(!await ask("가져오기","같은 경로의 기록을 덮어씁니다. 계속할까요?","가져오기")) return;
    for(const [k,v] of Object.entries(docs)){
      Store.docs.set(k,v);
      try{ await Store.set(k,v); }catch(e){}
    }
    await loadEverything();
    renderAll();
    toast("가져왔습니다.");
  };
  const cl = el("button","btn sm ghost","취소"); cl.type = "button";
  cl.onclick = ()=>{ host.textContent = ""; };
  row.append(go,cl); box.append(row); host.append(box);
}

/* ── toast ───────────────────────────────────────────────── */
function toast(msg, ms, alarm){
  const t = el("div","toast"+(alarm ? " alarm" : ""), esc(msg));
  $("#toasts").append(t);
  setTimeout(()=>t.remove(), ms || 3200);
}
const warned = new Set();
function warnOnce(msg){ if(warned.has(msg)) return; warned.add(msg); toast(msg, 7000); }

/* ═════════════════════════════════════════════════════════════
   8. 배선
   ════════════════════════════════════════════════════════════ */
$("#tabs").addEventListener("click", e=>{
  const b = e.target.closest("button[data-tab]");
  if(!b || !ME) return;
  for(const t of $("#tabs").children) t.setAttribute("aria-selected", String(t === b));
  for(const id of ["today","stats","history","setup"]) $("#tab-"+id).hidden = (id !== b.dataset.tab);
  scrollTo({top:0});
  renderAll();
});
$("#who").onclick = ()=>{ if(ME) gate(); };
$("#cal-prev").onclick = ()=>{ calMonth.m--; if(calMonth.m < 0){ calMonth.m = 11; calMonth.y--; } renderCal(); };
$("#cal-next").onclick = ()=>{ calMonth.m++; if(calMonth.m > 11){ calMonth.m = 0; calMonth.y++; } renderCal(); };

$("#btn-add-ex").onclick = async ()=>{
  const kind = await askPick("종목 추가", [
    {label:"세트/횟수 종목", value:"sets", note:"체크박스로 세트 체크"},
    {label:"거리 종목", value:"dist", note:"러닝처럼 한 번에"}
  ]);

  const cfg = cfgOf(ME.id);

    ? {id, name, code:"NEW", kind:"sets", sets:5, reps:10}
    : {id, name, code:"DST", kind:"dist", target:5, unit:"km"});

$("#btn-save-routine").onclick = async ()=>{
  const cfg = cfgOf(ME.id);
  const name = await askText("템플릿 저장","이름", `루틴 ${cfg.routines.length+1}`);
  if(!name) return;
  cfg.routines.push({ id:"rt"+Date.now().toString(36), name, exercises:cfg.exercises.map(e=>({...e})) });
  saveCfg(ME.id); renderSetup(); toast(`'${name}' 저장`);
};
$("#btn-routine").onclick = async ()=>{
  const cfg = cfgOf(ME.id);
  if(!cfg.routines.length){ toast("설정 탭에서 루틴 템플릿을 먼저 저장하세요."); return; }
  const pick = await askPick("루틴 불러오기", cfg.routines.map(r=>({
    label:r.name, value:r.id,
    note:r.exercises.map(x=>x.kind === "sets" ? `${x.sets}×${x.reps}` : `${nfmt(x.target)}${x.unit}`).join(" · ")
  })), "오늘의 목표 구성을 이 템플릿으로 바꿉니다.");
  if(!pick) return;
  const rt = cfg.routines.find(r=>r.id === pick);
  cfg.exercises = rt.exercises.map(x=>({...x}));
  saveCfg(ME.id); syncGoals(true); renderAll(); toast(`'${rt.name}' 적용`);
};
$("#btn-add-profile").onclick = async ()=>{
  const name = await askText("사람 추가","이름","");
  if(!name) return;
  const p = await createProfile(name);
  renderAll();
  if(await ask("프로필 전환", `'${p.name}'으로 지금 전환할까요?`,"전환")) switchTo(p.id);
};
async function switchTo(pid){
  ME = PROFILES.find(p=>p.id === pid);
  rememberMe(pid);
  HISTVIEW = pid;
  await afterIdentity();
  toast(`${ME.name}으로 전환했습니다.`);
}
$("#set-remind-time").onchange = e=>{
  const [h,m] = e.target.value.split(":").map(Number);
  const cfg = cfgOf(ME.id);
  cfg.remindH = h || 0; cfg.remindM = m || 0;
  saveCfg(ME.id); lastNotified = null;
  toast(`매일 ${pad(cfg.remindH)}:${pad(cfg.remindM)}에 남은 세트를 알립니다.`);
};
$("#set-remind-on").onchange = e=>{ cfgOf(ME.id).remindOn = e.target.checked; saveCfg(ME.id); };
$("#btn-notif-perm").onclick = async ()=>{
  if(!("Notification" in window)){ renderSetup(); return; }
  try{ await Notification.requestPermission(); }catch(e){}
  renderSetup();
};
$("#btn-notif-test").onclick = ()=> notify("세트 스코어보드","알림이 이렇게 도착합니다.");
document.querySelectorAll("[data-export]").forEach(b=>{
  b.onclick = ()=> b.dataset.export === "json"
    ? showIO("JSON 전체 백업", buildJSON(), `workout-${todayKey()}.json`)
    : showIO("CSV 기록", buildCSV(), `workout-${todayKey()}.csv`);
});
$("#btn-import").onclick = importUI;
$("#btn-reset").onclick = async ()=>{
  if(!await ask("내 기록 삭제", `${ME.name}의 모든 일자 기록을 지웁니다. 되돌릴 수 없습니다.`,"계속","danger")) return;
  if(!await ask("한 번 더 확인","먼저 JSON 백업을 받아 두는 것을 권합니다. 지금 지울까요?","지우기","danger")) return;
  for(const d of daysOf(ME.id)){
    const p = dayPath(ME.id, d.date);
    Store.docs.delete(p);
    try{ await Store.del(p); }catch(e){}
  }
  renderAll();
  toast("내 기록을 지웠습니다.");
};

/* ═════════════════════════════════════════════════════════════
   9. 부팅
   ════════════════════════════════════════════════════════════ */
function renderAll(){
  if(!ME) return;
  renderHeader();
  if(!$("#tab-today").hidden) renderToday();
  if(!$("#tab-stats").hidden) renderStats();
  if(!$("#tab-history").hidden) renderHistory();
  if(!$("#tab-setup").hidden){
    // 값이 blur/Enter에서 커밋되므로, 입력 중 재렌더는 건너뛰어 포커스를 지킨다
    const typing = $("#tab-setup").contains(document.activeElement)
      && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if(!typing) renderSetup();
  }
}
async function loadEverything(){
  const profs = await Store.loadAll("profiles");
  PROFILES = profs.filter(p=>p && p.id).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  const cfgs = await Store.loadAll("config");
  CFG = new Map(cfgs.filter(c=>c && c.pid).map(c=>[c.pid, c]));
  await Store.loadAll("days");
}
async function afterIdentity(){
  $("#boot").hidden = true;
  $("#tab-today").hidden = false;
  finalizePast();
  myDay();
  renderAll();
}
async function boot(){
  await Store.init();
  await loadEverything();
  const saved = readSavedMe();
  ME = PROFILES.find(p=>p.id === saved) || null;
  if(!ME){ $("#boot").textContent = "프로필을 선택해 주세요."; await gate(); }
  else { HISTVIEW = ME.id; await afterIdentity(); }

  // 다른 기기·상대방의 변경을 실시간으로 받는다
  Store.watch("profiles", null, ()=>{
    const profs = [];
    for(const [k,v] of Store.docs) if(k.startsWith("profiles/")) profs.push(v);
    PROFILES = profs.filter(p=>p && p.id).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    if(ME) ME = PROFILES.find(p=>p.id === ME.id) || ME;
    renderAll();
  });
  Store.watch("config", null, ()=>{
    for(const [k,v] of Store.docs) if(k.startsWith("config/") && v?.pid) CFG.set(v.pid, v);
    renderAll();
  });
  let stopDays = null;
  const watchToday = ()=>{
    if(stopDays) stopDays();
    stopDays = Store.watch("days", {field:"date", op:"==", value:todayKey()}, ()=>{ renderAll(); });
  };
  watchToday();

  // Supabase 모드에는 실시간 푸시가 없으므로 주기적으로 끌어온다.
  // 화면이 보일 때만 돌리고, 앱으로 돌아오는 순간에도 한 번 당긴다.
  if(Store.mode === "supa"){
    const pull = async ()=>{ if(await Store.refresh()) renderAll(); };
    setInterval(()=>{ if(!document.hidden) pull(); }, 20000);
    addEventListener("focus", pull);
    document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) pull(); });
  }

  let lastTick = todayKey();
  setInterval(()=>{
    const tk = todayKey();
    if(tk !== lastTick){
      lastTick = tk;
      watchToday();
      if(ME){ finalizePast(); myDay(); renderAll(); }
      toast("자정이 지나 새 하루가 시작됐습니다.", 5000);
    }
    checkReminder();
  }, 30000);
  checkReminder();
}
boot().catch(err=>{
  $("#boot").textContent = "시작하지 못했습니다: " + (err?.message || err);
});
